<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="손절 관리">
<meta name="theme-color" content="#0a0c0f">
<title>손절가 관리</title>
<link rel="apple-touch-icon" id="appIcon" href="">
<script>
(function(){
  try {
    var s = 180;
    var c = document.createElement('canvas');
    c.width = c.height = s;
    var ctx = c.getContext('2d');

    function roundRect(ctx,x,y,w,h,r){
      ctx.beginPath();
      ctx.moveTo(x+r,y);
      ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
      ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
      ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
      ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
      ctx.closePath();
    }

    var cx = s/2, cy = s/2;

    // 배경
    var bg = ctx.createLinearGradient(0,0,s,s);
    bg.addColorStop(0,'#0d1117');
    bg.addColorStop(1,'#0a0c10');
    roundRect(ctx,0,0,s,s,s*0.22);
    ctx.fillStyle = bg; ctx.fill();

    // 테두리 글로우
    roundRect(ctx,0,0,s,s,s*0.22);
    ctx.strokeStyle='rgba(255,82,82,0.18)';
    ctx.lineWidth=s*0.012; ctx.stroke();

    // 캔들 배경
    var candles=[
      {x:0.18,high:0.30,low:0.72,open:0.62,close:0.38},
      {x:0.30,high:0.28,low:0.68,open:0.40,close:0.32},
      {x:0.42,high:0.22,low:0.65,open:0.36,close:0.26},
      {x:0.54,high:0.25,low:0.70,open:0.28,close:0.58},
      {x:0.66,high:0.20,low:0.60,open:0.55,close:0.24},
      {x:0.78,high:0.16,low:0.55,open:0.26,close:0.20},
    ];
    var cw=s*0.055;
    candles.forEach(function(d){
      var isUp=d.close<d.open;
      ctx.beginPath(); ctx.moveTo(d.x*s,d.high*s); ctx.lineTo(d.x*s,d.low*s);
      ctx.strokeStyle=isUp?'rgba(0,229,160,0.12)':'rgba(255,82,82,0.10)';
      ctx.lineWidth=s*0.008; ctx.stroke();
      ctx.fillStyle=isUp?'rgba(0,229,160,0.18)':'rgba(255,82,82,0.15)';
      ctx.fillRect(d.x*s-cw/2,Math.min(d.open,d.close)*s,cw,Math.max(Math.abs(d.open-d.close)*s,s*0.015));
    });

    // 손절선 (점선 빨간선)
    var ly=s*0.63;
    var lg=ctx.createLinearGradient(s*0.1,0,s*0.9,0);
    lg.addColorStop(0,'rgba(255,82,82,0)');
    lg.addColorStop(0.2,'rgba(255,82,82,0.9)');
    lg.addColorStop(0.8,'rgba(255,82,82,0.9)');
    lg.addColorStop(1,'rgba(255,82,82,0)');
    // 글로우
    ctx.beginPath(); ctx.moveTo(s*0.10,ly); ctx.lineTo(s*0.90,ly);
    ctx.strokeStyle='rgba(255,82,82,0.15)'; ctx.lineWidth=s*0.07; ctx.setLineDash([]); ctx.stroke();
    // 점선
    ctx.beginPath(); ctx.moveTo(s*0.10,ly); ctx.lineTo(s*0.90,ly);
    ctx.strokeStyle=lg; ctx.lineWidth=s*0.022; ctx.setLineDash([s*0.04,s*0.025]); ctx.stroke();
    ctx.setLineDash([]);

    // 방패
    var shW=s*0.38, shH=s*0.42;
    var sx=cx-shW/2, sy=cy-shH/2-s*0.04;
    ctx.beginPath();
    ctx.moveTo(cx,sy);
    ctx.lineTo(sx+shW,sy+shH*0.28);
    ctx.quadraticCurveTo(sx+shW,sy+shH*0.75,cx,sy+shH);
    ctx.quadraticCurveTo(sx,sy+shH*0.75,sx,sy+shH*0.28);
    ctx.closePath();
    var sg=ctx.createLinearGradient(sx,sy,sx+shW,sy+shH);
    sg.addColorStop(0,'rgba(255,82,82,0.22)');
    sg.addColorStop(1,'rgba(255,82,82,0.10)');
    ctx.fillStyle=sg; ctx.fill();
    ctx.strokeStyle='rgba(255,82,82,0.7)'; ctx.lineWidth=s*0.018; ctx.stroke();

    // 하향 화살표
    var aw=s*0.11, ah=s*0.16, ax=cx, ay=cy-s*0.02;
    ctx.beginPath(); ctx.moveTo(ax,ay-ah*0.55); ctx.lineTo(ax,ay+ah*0.25);
    ctx.strokeStyle='#ff5252'; ctx.lineWidth=s*0.045; ctx.lineCap='round'; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ax-aw*0.7,ay); ctx.lineTo(ax,ay+ah*0.5); ctx.lineTo(ax+aw*0.7,ay);
    ctx.strokeStyle='#ff5252'; ctx.lineWidth=s*0.045; ctx.lineJoin='round'; ctx.lineCap='round'; ctx.stroke();

    // STOP 텍스트
    ctx.font='700 '+(s*0.115)+'px "IBM Plex Mono",monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowColor='rgba(255,82,82,0.6)'; ctx.shadowBlur=s*0.04;
    ctx.fillStyle='#ff5252'; ctx.fillText('STOP',cx,s*0.84);
    ctx.shadowBlur=0;

    // 우상단 경고 점
    var dr=s*0.055;
    ctx.beginPath(); ctx.arc(s*0.78,s*0.22,dr*1.6,0,Math.PI*2);
    ctx.fillStyle='rgba(255,82,82,0.2)'; ctx.fill();
    ctx.beginPath(); ctx.arc(s*0.78,s*0.22,dr,0,Math.PI*2);
    var dg=ctx.createRadialGradient(s*0.78,s*0.22,0,s*0.78,s*0.22,dr);
    dg.addColorStop(0,'#ff5252'); dg.addColorStop(1,'#cc0022');
    ctx.fillStyle=dg; ctx.fill();

    var link=document.getElementById('appIcon');
    if(link) link.href=c.toDataURL('image/png');
  } catch(e){}
})();
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
:root {
  --bg: #0a0c0f;
  --surface: #111418;
  --surface2: #1a1f26;
  --border: #2a3340;
  --accent: #00e5a0;
  --accent2: #4da6ff;
  --danger: #ff5252;
  --warn: #ffb74d;
  --text: #ffffff;
  --text2: #d0d9de;
  --text3: #96aab5;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px;
  min-height: 100vh;
  padding-top: env(safe-area-inset-top);
  padding-bottom: calc(env(safe-area-inset-bottom) + 16px);
}

/* ── 헤더 ── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.logo { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; color: var(--danger); letter-spacing: 3px; }
.htitle { font-size: 13px; font-weight: 500; }
.hbadge {
  margin-left: auto;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  padding: 3px 8px;
  border-radius: 3px;
  background: rgba(255,82,82,.1);
  color: var(--danger);
  border: 1px solid rgba(255,82,82,.2);
}

/* ── 레이아웃 ── */
.layout {
  max-width: 900px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 0;
}

.layout-body {
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 16px 16px 32px;
}

.list-panel, .input-panel {
  /* margin handled by layout-body gap */
}

/* ── 입력 패널 ── */
.input-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.panel-header {
  padding: 12px 16px;
  border-bottom: none;
  display: flex;
  align-items: center;
  gap: 8px;
}
.panel-title {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--danger);
}
.panel-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }

.input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.input-group label {
  display: block;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  letter-spacing: 1px;
  color: var(--text2);
  text-transform: uppercase;
  margin-bottom: 4px;
}
.input-group input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 9px 11px;
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  transition: border-color .2s;
}
.input-group input:focus { outline: none; border-color: var(--danger); }

/* 미리보기 */
.preview-box {
  background: var(--surface2);
  border: 1px solid rgba(255,82,82,.25);
  border-radius: 6px;
  padding: 12px 14px;
  display: none;
  flex-direction: column;
  gap: 8px;
}
.preview-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
}
.preview-stop-val {
  font-size: 18px;
  font-weight: 600;
  color: var(--danger);
  letter-spacing: 1px;
}
.preview-label { color: var(--text3); font-size: 10px; }
.preview-divider { height: 1px; background: var(--border); }

/* 매수 전 체크리스트 */
.checklist-box {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.checklist-title-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.checklist-title {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  letter-spacing: 1px;
  color: var(--text2);
  text-transform: uppercase;
}
.checklist-count {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  padding: 2px 7px;
  border-radius: 3px;
  background: rgba(255,82,82,.1);
  color: var(--danger);
  border: 1px solid rgba(255,82,82,.2);
  transition: all .2s;
}
.checklist-count.full {
  background: rgba(0,229,160,.12);
  color: var(--accent);
  border-color: rgba(0,229,160,.3);
}
.checklist-item {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 12px;
  color: var(--text2);
  cursor: pointer;
  user-select: none;
  transition: color .15s;
}
.checklist-item input[type="checkbox"] {
  width: 16px;
  height: 16px;
  min-width: 16px;
  margin-top: 0;
  accent-color: var(--accent);
  cursor: pointer;
}
.checklist-item.checked { color: var(--text); }

/* 등록 버튼 */
.reg-btn {
  background: var(--danger);
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 12px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.5px;
  cursor: pointer;
  transition: all .2s;
  text-transform: uppercase;
  width: 100%;
}
.reg-btn:hover { background: #ff5252; transform: translateY(-1px); }

/* ── 계좌 리스크 요약 ── */
.risk-bar {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.risk-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 14px;
}
.risk-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 8px;
  letter-spacing: 1.5px;
  color: var(--text3);
  text-transform: uppercase;
  margin-bottom: 5px;
}
.risk-val {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 16px;
  font-weight: 600;
}
.risk-sub { font-size: 9px; color: var(--text2); margin-top: 2px; }

/* ── 손절 리스트 ── */
.list-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.list-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.list-title {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text2);
}
.list-count {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--danger);
  font-weight: 600;
}
.list-body { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.empty-msg {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--text3);
  text-align: center;
  padding: 28px 0;
  line-height: 2;
}

/* ── 손절 카드 ── */
.stop-card {
  background: var(--surface2);
  border-radius: 6px;
  border-left: 3px solid var(--danger);
  border-top: 1px solid var(--border);
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  transition: all .2s;
}
.stop-card.status-near {
  border-left-color: var(--warn);
}
.stop-card.status-breach {
  border-left-color: #ff5252;
}
.stop-card.status-profit {
  border-left-color: var(--accent);
}

/* ── 전체 종목 한눈에 ── */
.overview-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 9px 12px;
  border-bottom: 1px solid var(--border);
  font-family: 'IBM Plex Mono', monospace;
}
.overview-row:last-child { border-bottom: none; }
.overview-row-top {
  display: flex;
  align-items: center;
  gap: 5px;
}
.overview-row-mid {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 5px;
  padding-left: 11px;
}
.overview-row-bot {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 5px;
  padding-left: 11px;
}
.overview-row-low {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  padding-left: 11px;
  font-size: 12px;
}
.overview-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.overview-name { font-size: 13px; font-weight: 600; color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.overview-pct  { font-size: 14px; font-weight: 700; white-space: nowrap; }
.overview-amt  { font-size: 12px; white-space: nowrap; }
.overview-stop { font-size: 12px; color: var(--text); white-space: nowrap; }
.overview-qty  { font-size: 11px; white-space: nowrap; }
.low-alert-blink {
  display: inline-block;
  border: 1px solid rgba(255,82,82,.25);
  border-radius: 4px;
  padding: 2px 6px;
  animation: blink-border-danger 1s ease-in-out infinite;
}
@keyframes blink-border-danger {
  0%,100% { border-color: rgba(255,82,82,.2); }
  50% { border-color: rgba(255,82,82,1); }
}
.hold-overdue-box {
  display: inline-block;
  border: 1px solid rgba(255,82,82,.7);
  border-radius: 4px;
  padding: 2px 6px;
}
.tgt-alert-blink {
  display: inline-block;
  border: 1px solid rgba(0,229,160,.25);
  border-radius: 4px;
  padding: 2px 6px;
  animation: blink-border-accent 1s ease-in-out infinite;
}
@keyframes blink-border-accent {
  0%,100% { border-color: rgba(0,229,160,.2); }
  50% { border-color: rgba(0,229,160,1); }
}

.card-top { display: flex; justify-content: space-between; align-items: center; }
.card-name { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; color: var(--warn); }
.card-actions { display: flex; align-items: center; gap: 8px; }

.status-badge {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  padding: 2px 7px;
  border-radius: 3px;
  font-weight: 600;
}
.badge-ok { background: rgba(0,229,160,.1); color: var(--accent); border: 1px solid rgba(0,229,160,.2); }
.badge-near { background: rgba(255,183,77,.15); color: var(--warn); border: 1px solid rgba(255,183,77,.3); }
.badge-breach { background: rgba(255,82,82,.2); color: #ff5252; border: 1px solid rgba(255,82,82,.4); }

.del-btn { color: var(--text3); cursor: pointer; font-size: 14px; transition: color .15s; padding: 2px 4px; }
.del-btn:hover { color: var(--danger); }

.card-metrics { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.metric { display: flex; flex-direction: column; gap: 1px; }
.metric-label { font-family: 'IBM Plex Mono', monospace; font-size: 7px; color: var(--text2); letter-spacing: 1px; text-transform: uppercase; }
.metric-val { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 500; }

/* 현재가 입력 */
.price-input-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
}
.price-input-line {
  display: flex;
  gap: 6px;
  align-items: center;
}
.price-input {
  width: 100px;
  flex-shrink: 0;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 7px 10px;
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  transition: border-color .2s;
}
.price-input:focus { outline: none; border-color: var(--accent2); }
.low-input {
  width: 100px;
  border-color: rgba(255,200,100,.3);
  color: #ffc864;
}
.low-input:focus { border-color: #ffc864 !important; }
.low-input::placeholder { color: rgba(255,200,100,.35); font-size: 10px; }
.price-status {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  white-space: nowrap;
  flex: 1;
  text-align: right;
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── 고정 패널 (헤더 아래 sticky) ── */
.sticky-panel {
  position: sticky;
  top: 0;
  z-index: 90;
  background: var(--bg);
  padding: 6px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 5px;
}

/* ── 설정 (가로 스크롤 한 줄) ── */
.settings-row {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding-bottom: 1px;
}
.settings-row::-webkit-scrollbar { display: none; }
.settings-row .setting-block:last-child {
  border-color: rgba(0,229,160,.2);
  background: rgba(0,229,160,.04);
}
.setting-block {
  flex: 0 0 auto;
  min-width: 78px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 4px 9px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 1px;
}
.setting-label { font-family: 'IBM Plex Mono', monospace; font-size: 7.5px; color: var(--text3); letter-spacing: .5px; text-transform: uppercase; white-space: nowrap; }
.setting-input {
  width: 100%;
  min-width: 50px;
  background: transparent;
  border: none;
  padding: 0;
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  font-weight: 600;
  text-align: left;
}
.setting-input:focus { outline: none; }

/* ── 버튼 + 리스크 요약 (가로 스크롤 한 줄) ── */
.ctrl-row {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding-bottom: 1px;
}
.ctrl-row::-webkit-scrollbar { display: none; }
.ctrl-row .action-btn {
  flex: 0 0 auto;
  min-width: 72px;
  white-space: nowrap;
}
.action-btn {
  padding: 6px 10px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text2);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  cursor: pointer;
  transition: all .2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  letter-spacing: .3px;
}
.action-btn:hover { filter: brightness(1.3); }
.action-btn.export { border-color: rgba(77,166,255,.3); color: var(--accent2); background: rgba(77,166,255,.06); }
.action-btn.import { border-color: rgba(0,229,160,.3); color: var(--accent); background: rgba(0,229,160,.06); }
.action-btn.danger { border-color: rgba(255,82,82,.3); color: var(--danger); background: rgba(255,82,82,.06); }

.ctrl-row .risk-card {
  flex: 0 0 auto;
  min-width: 112px;
}
.risk-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 5px 8px;
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.risk-card-left { display: flex; flex-direction: column; gap: 0px; flex: 1; min-width: 0; }
.risk-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 7px;
  letter-spacing: 1px;
  color: var(--text3);
  text-transform: uppercase;
  white-space: nowrap;
}
.risk-val {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.2;
}
.risk-sub { font-size: 8px; color: var(--text2); font-family: 'IBM Plex Mono', monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.risk-badges { display: flex; flex-direction: column; gap: 2px; align-items: flex-end; }
.mini-badge {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 8px;
  padding: 1px 5px;
  border-radius: 3px;
  font-weight: 600;
  white-space: nowrap;
}
.mini-badge-loss { background: rgba(255,82,82,.12); color: var(--danger); border: 1px solid rgba(255,82,82,.2); }
.mini-badge-profit { background: rgba(0,229,160,.1); color: var(--accent); border: 1px solid rgba(0,229,160,.2); }
.mini-badge-wait { background: rgba(96,125,139,.1); color: var(--text3); border: 1px solid rgba(96,125,139,.15); }

.clear-btn {
  background: transparent;
  border: 1px solid rgba(255,82,82,.3);
  border-radius: 4px;
  padding: 5px 10px;
  color: var(--danger);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  cursor: pointer;
  transition: all .2s;
}
.clear-btn:hover { background: rgba(255,82,82,.1); }

/* ── 토스트 ── */
.toast {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom) + 20px);
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 18px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--text);
  transition: transform .3s ease;
  z-index: 999;
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* ── 반응형 (아이폰 전체 너비 375~430px 대응) ── */
@media (max-width: 600px) {
  .input-grid { grid-template-columns: 1fr 1fr; }
  .card-metrics { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 480px) {
  header { padding: 12px 14px; gap: 8px; }
  .htitle { font-size: 12px; }
  .hbadge { display: none; }
  .layout-body { padding: 14px 12px 28px; gap: 14px; }
  .sticky-panel { padding: 6px 10px; }
  .setting-block { min-width: 70px; padding: 4px 7px; }
  .setting-label { font-size: 7px; }
  .setting-input { font-size: 12px; }
  .ctrl-row .action-btn { min-width: 64px; font-size: 8.5px; padding: 6px 6px; }
  .ctrl-row .risk-card { min-width: 100px; padding: 5px 7px; }
  .price-input { width: 92px; }
  .panel-header { padding: 10px 12px; gap: 6px; flex-wrap: wrap; }
  .panel-title { font-size: 9px; }
  #overviewPanelHeader span[style*="margin-left:auto"] { font-size: 10px; }
  .card-name { font-size: 13px; }
  .status-badge { font-size: 8px; padding: 2px 5px; }
  .card-top { flex-wrap: wrap; row-gap: 4px; }
}

.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; min-width: 0; font-family: 'IBM Plex Mono', monospace; }
.stat-label { font-size: 8px; letter-spacing: 1px; color: var(--text3); }
.stat-val { font-size: 15px; font-weight: 700; line-height: 1.35; white-space: nowrap; }
.stat-sub { font-size: 9px; color: var(--text2); min-height: 13px; display: flex; align-items: center; gap: 3px; white-space: nowrap; overflow: hidden; }
.hdr-actions { margin-left: auto; display: flex; gap: 5px; }
.hdr-actions .action-btn { padding: 5px 8px; font-size: 9px; white-space: nowrap; }
</style>
</head>
<body>

<header>
  <div class="logo">STOP</div>
  <div style="color:var(--text3)">/</div>
  <div class="htitle">손절가 관리</div>
  <div class="hdr-actions">
    <button class="action-btn export" onclick="exportData()">내보내기</button>
    <button class="action-btn import" onclick="showImport()">가져오기</button>
    <button class="action-btn danger" onclick="clearAll()">삭제</button>
  </div>
</header>

<div class="layout">

  <input type="file" id="importFile" accept=".json" style="display:none" onchange="importFile(this)">

  <!-- ── 고정 패널 ── -->
  <div class="sticky-panel">
    <div class="stat-grid">
      <div class="stat">
        <div class="stat-label">등록 종목</div>
        <div class="stat-val" id="sum_count" style="color:var(--text)">0</div>
        <div class="stat-sub">
          <span class="mini-badge mini-badge-loss" id="sum_loss_badge" style="display:none"></span>
          <span class="mini-badge mini-badge-profit" id="sum_profit_badge" style="display:none"></span>
          <span class="mini-badge mini-badge-wait" id="sum_wait_badge" style="display:none"></span>
        </div>
      </div>
      <div class="stat">
        <div class="stat-label">현재 수익</div>
        <div class="stat-val" id="sum_pnl" style="color:var(--text3)">−</div>
        <div class="stat-sub" id="sum_pnl_sub">현재가 입력 시</div>
      </div>
      <div class="stat">
        <div class="stat-label">실제매수합</div>
        <div class="stat-val" id="cfg_actual_sum" style="color:var(--accent)">−</div>
        <div class="stat-sub">만원</div>
      </div>
    </div>
  </div><!-- /sticky-panel -->

  <div class="layout-body">

  <!-- 입력 패널 (토글) -->
  <div class="input-panel">
    <div class="panel-header" id="inputPanelHeader" onclick="toggleInputPanel()" style="cursor:pointer;user-select:none">
      <div class="panel-title">🛑 손절가 등록</div>
      <span style="font-size:9px;color:var(--text3);font-family:'IBM Plex Mono',monospace">매수 즉시 등록</span>
      <span id="inputPanelChevron" style="margin-left:auto;font-size:12px;color:var(--text3);transition:transform .25s;display:inline-block;transform:rotate(0deg)">▼</span>
    </div>
    <div class="panel-body" id="inputPanelBody" style="display:none">

      <div class="input-grid">
        <div class="input-group">
          <label>종목명</label>
          <input id="sl_name" type="text" placeholder="삼성전자">
        </div>
        <div class="input-group">
          <label>매수가 (원)</label>
          <input id="sl_entry" type="number" placeholder="71500" oninput="calcLowPreview()">
        </div>
      </div>

      <div class="input-grid">
        <div class="input-group">
          <label>6일 저가 (원)</label>
          <input id="sl_low6" type="number" placeholder="70000" oninput="calcLowPreview()">
        </div>
        <div class="input-group">
          <label>11일 저가 (원)</label>
          <input id="sl_low11" type="number" placeholder="68000" oninput="calcLowPreview()">
        </div>
      </div>

      <div class="input-group">
        <label>보유 수량 (주) <span style="color:var(--text3)">선택</span></label>
        <input id="sl_qty" type="number" placeholder="100" oninput="calcLowPreview()">
      </div>

      <div class="input-group">
        <label>매수 근거</label>
        <input id="sl_memo" type="text" placeholder="MA20돌파+거래량">
      </div>

      <div class="input-group">
        <label>매수일자</label>
        <input id="sl_date" type="date">
      </div>

      <!-- 매수 전 체크리스트 -->
      <div class="checklist-box" id="entryChecklist">
        <div class="checklist-title-row">
          <span class="checklist-title">📋 매수 전 체크리스트</span>
          <span class="checklist-count" id="checklistCount">0/7</span>
        </div>
        <label class="checklist-item" for="chk_d_ma20">
          <input type="checkbox" id="chk_d_ma20" onchange="updateChecklistCount()">
          <span>일봉 20일선 위</span>
        </label>
        <label class="checklist-item" for="chk_w_ma20">
          <input type="checkbox" id="chk_w_ma20" onchange="updateChecklistCount()">
          <span>주봉 20일선 위</span>
        </label>
        <label class="checklist-item" for="chk_rsi">
          <input type="checkbox" id="chk_rsi" onchange="updateChecklistCount()">
          <span>RSI 50 이상<span style="display:block;font-size:10px;line-height:1.4;color:var(--text3);margin-top:1px">최근 14일 상승·하락 강도 비교(0~100). 50 이상이면 상승 우위, 70 이상은 과열, 30 이하는 과매도.</span></span>
        </label>
        <label class="checklist-item" for="chk_adx">
          <input type="checkbox" id="chk_adx" onchange="updateChecklistCount()">
          <span>ADX 20 이상<span style="display:block;font-size:10px;line-height:1.4;color:var(--text3);margin-top:1px">추세의 '강도'만 보여줌(방향 아님, 0~100). 20 이상이면 추세 시작, 25 이상이면 뚜렷. 방향은 PDI(상승 압력)와 MDI(하락 압력)로 확인.</span></span>
        </label>
        <label class="checklist-item" for="chk_pdi30">
          <input type="checkbox" id="chk_pdi30" onchange="updateChecklistCount()">
          <span>PDI 30 이상</span>
        </label>
        <label class="checklist-item" for="chk_mdi18">
          <input type="checkbox" id="chk_mdi18" onchange="updateChecklistCount()">
          <span>MDI 18 이하</span>
        </label>
        <label class="checklist-item" for="chk_adx_up">
          <input type="checkbox" id="chk_adx_up" onchange="updateChecklistCount()">
          <span>ADX 상승 중</span>
        </label>
      </div>

      <!-- 미리보기 -->
      <div class="preview-box" id="preview">
        <div class="preview-row">
          <span class="preview-label">6일 저가 · 매수대비</span>
          <span id="prev_l6" style="font-family:'IBM Plex Mono',monospace;font-size:11px">−</span>
        </div>
        <div class="preview-row">
          <span class="preview-label">11일 저가 · 매수대비</span>
          <span id="prev_l11" style="font-family:'IBM Plex Mono',monospace;font-size:11px">−</span>
        </div>
      </div>

      <button class="reg-btn" onclick="addStop()">🛑 손절가 등록</button>
    </div>
  </div>

  <!-- 전체 종목 한눈에 보기 (토글) -->
  <div class="input-panel">
    <div class="panel-header" id="overviewPanelHeader" onclick="toggleOverviewPanel()" style="cursor:pointer;user-select:none">
      <div class="panel-title" style="color:var(--accent2);white-space:nowrap">📊 한눈에</div>
      <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#fff;margin-left:auto;margin-right:8px">손익 <span id="overviewTotalEval" style="font-weight:600">−</span></span>
      <span class="list-count" id="overviewCount" style="margin-right:8px">0개</span>
      <span id="overviewPanelChevron" style="font-size:12px;color:#fff;transition:transform .25s;display:inline-block;transform:rotate(0deg)">▼</span>
    </div>
    <div id="overviewBody" style="display:none;padding:4px 0"></div>
  </div>

  <!-- 손절 리스트 -->
  <div class="list-panel">
    <div class="list-header">
      <div class="list-title">등록된 손절가</div>
      <div class="list-count" id="listCount">0개</div>
    </div>
    <div class="list-body" id="stopList">
      <div class="empty-msg">등록된 손절가 없음<br>매수 즉시 손절가를 등록하세요</div>
    </div>
  </div>

  </div><!-- /layout-body -->
</div><!-- /layout -->

<div class="toast" id="toast"></div>

<script>
// ── 상태 ──
var entries = [];

// ── localStorage ──
var _mem = {};
function _set(k, v) { try { localStorage.setItem(k, v); } catch(e) {} _mem[k] = v; }
function _get(k) { try { var v = localStorage.getItem(k); if (v !== null) return v; } catch(e) {} return _mem[k] || null; }

// ── 한국 공휴일 (주말 제외 영업일 계산용, 대체공휴일 포함) ──
// 출처: 공공데이터포털 특일 정보 기준. 2025~2027년만 등재되어 있으며,
// 범위를 벗어난 연도는 주말만 제외하고 계산합니다. 매년 12월경 다음 해 목록을 추가해 주세요.
var KR_HOLIDAYS = {
  "2025-01-01":1, "2025-01-27":1, "2025-01-28":1, "2025-01-29":1, "2025-01-30":1,
  "2025-03-01":1, "2025-03-03":1, "2025-05-05":1, "2025-05-06":1, "2025-06-03":1,
  "2025-06-06":1, "2025-08-15":1, "2025-10-03":1, "2025-10-05":1, "2025-10-06":1,
  "2025-10-07":1, "2025-10-08":1, "2025-10-09":1, "2025-12-25":1,
  "2026-01-01":1, "2026-02-16":1, "2026-02-17":1, "2026-02-18":1, "2026-03-01":1,
  "2026-03-02":1, "2026-05-01":1, "2026-05-05":1, "2026-05-24":1, "2026-05-25":1,
  "2026-06-03":1, "2026-06-06":1, "2026-07-17":1, "2026-08-15":1, "2026-08-17":1,
  "2026-09-24":1, "2026-09-25":1, "2026-09-26":1, "2026-10-03":1, "2026-10-05":1,
  "2026-10-09":1, "2026-12-25":1,
  "2027-01-01":1, "2027-02-06":1, "2027-02-07":1, "2027-02-08":1, "2027-02-09":1,
  "2027-03-01":1, "2027-05-01":1, "2027-05-03":1, "2027-05-05":1, "2027-05-13":1,
  "2027-06-06":1, "2027-07-17":1, "2027-07-19":1, "2027-08-15":1, "2027-08-16":1,
  "2027-09-14":1, "2027-09-15":1, "2027-09-16":1, "2027-10-03":1, "2027-10-04":1,
  "2027-10-09":1, "2027-10-11":1, "2027-12-25":1, "2027-12-27":1
};

function isoDate(d) {
  var y = d.getFullYear(), m = ('0' + (d.getMonth() + 1)).slice(-2), day = ('0' + d.getDate()).slice(-2);
  return y + '-' + m + '-' + day;
}

// startDate(매수일) 다음날부터 endDate까지, 주말·공휴일을 제외한 영업일 수를 센다.
function businessDaysBetween(startDate, endDate) {
  var d = new Date(startDate);
  d.setHours(0, 0, 0, 0);
  var end = new Date(endDate);
  end.setHours(0, 0, 0, 0);
  var count = 0;
  while (d < end) {
    d.setDate(d.getDate() + 1);
    var dow = d.getDay();
    if (dow !== 0 && dow !== 6 && !KR_HOLIDAYS[isoDate(d)]) count++;
  }
  return count;
}

// ── 공통 헬퍼 ──
function findEntry(id) {
  for (var i = 0; i < entries.length; i++) { if (entries[i].id === id) return entries[i]; }
  return null;
}
function fmtPct(p) { return (p >= 0 ? '+' : '') + p.toFixed(1) + '%'; }
function fmtWon(n) { return (n >= 0 ? '+' : '') + n.toLocaleString() + '원'; }
// 매수가 대비 N일 저가: % + (수량이 있으면) 그 가격에 팔 때의 손익금액
function lowInfo(base, entry, low, qty) {
  if (!(low > 0) || !(base > 0) || !(entry > 0)) return null;
  return { pct: (low - entry) / entry * 100, amt: (qty > 0) ? Math.round((low - entry) * qty) : null };
}
function amtCol(i) { return !i || i.amt === null ? '#fff' : i.amt >= 0 ? 'var(--accent)' : '#ff5252'; }
function lowTxt(i) { return i ? fmtPct(i.pct) + (i.amt !== null ? ' · ' + fmtWon(i.amt) : '') : '−'; }
function lowCol(i) { return !i ? '#fff' : i.pct >= 0 ? 'var(--accent)' : '#ff5252'; }

// ── 등록창 미리보기 ──
function calcLowPreview() {
  var entry = parseFloat(document.getElementById('sl_entry').value);
  var qty   = parseFloat(document.getElementById('sl_qty').value);
  var l6  = lowInfo(entry, entry, parseFloat(document.getElementById('sl_low6').value), qty);
  var l11 = lowInfo(entry, entry, parseFloat(document.getElementById('sl_low11').value), qty);
  var p = document.getElementById('preview');
  if (!l6 && !l11) { p.style.display = 'none'; return; }
  p.style.display = 'flex';
  [['prev_l6', l6], ['prev_l11', l11]].forEach(function(x) {
    var el = document.getElementById(x[0]);
    el.textContent = lowTxt(x[1]);
    el.style.color = lowCol(x[1]);
  });
}

// ── 등록 ──
// ── 매수 전 체크리스트 ──
var CHECKLIST_IDS = ['chk_d_ma20', 'chk_w_ma20', 'chk_rsi', 'chk_adx', 'chk_pdi30', 'chk_mdi18', 'chk_adx_up'];

function updateChecklistCount() {
  var checked = 0;
  CHECKLIST_IDS.forEach(function(id) {
    var el = document.getElementById(id);
    if (!el) return;
    var item = el.closest('.checklist-item');
    if (el.checked) {
      checked++;
      if (item) item.classList.add('checked');
    } else {
      if (item) item.classList.remove('checked');
    }
  });
  var countEl = document.getElementById('checklistCount');
  if (countEl) {
    countEl.textContent = checked + '/' + CHECKLIST_IDS.length;
    countEl.classList.toggle('full', checked === CHECKLIST_IDS.length);
  }
  return checked;
}

function getChecklistState() {
  var state = {};
  CHECKLIST_IDS.forEach(function(id) { var el = document.getElementById(id); state[id] = !!(el && el.checked); });
  return state;
}

function resetChecklist() {
  CHECKLIST_IDS.forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.checked = false;
  });
  updateChecklistCount();
}

function addStop() {
  var name  = document.getElementById('sl_name').value.trim();
  var entry = parseFloat(document.getElementById('sl_entry').value);
  var l6    = parseFloat(document.getElementById('sl_low6').value);
  var l11   = parseFloat(document.getElementById('sl_low11').value);
  var qty   = parseFloat(document.getElementById('sl_qty').value);
  var date  = document.getElementById('sl_date').value;
  var memo  = document.getElementById('sl_memo').value.trim();

  if (!name)         { showToast('종목명을 입력하세요', 'warn'); return; }
  if (isNaN(entry))  { showToast('매수가를 입력하세요', 'warn'); return; }

  entries.push({
    id:        Date.now(),
    name:      name,
    entry:     entry,
    low6:      isNaN(l6)  ? null : l6,
    low11:     isNaN(l11) ? null : l11,
    qty:       isNaN(qty) ? null : qty,
    buyDate:   date || null,
    memo:      memo || null,
    checklist: getChecklistState(),
    cur:       null,
    executed:  null,
    sold1:     false,
    addedAt:   new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }),
  });

  save();
  clearInputs();
  renderAll();
  showToast('✓ ' + name + ' 등록', 'ok');
}

function clearInputs() {
  ['sl_name','sl_entry','sl_low6','sl_low11','sl_qty','sl_date','sl_memo'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.value = '';
  });
  document.getElementById('preview').style.display = 'none';
  resetChecklist();
}

function removeStop(id) {
  entries = entries.filter(function(e) { return e.id !== id; });
  save();
  renderAll();
}

function cardInputNav(event, nextId, prevId) {
  if (event.key === 'ArrowDown' && nextId) {
    event.preventDefault();
    var el = document.getElementById(nextId);
    if (el) { el.focus(); el.select(); }
  } else if (event.key === 'ArrowUp' && prevId) {
    event.preventDefault();
    var el = document.getElementById(prevId);
    if (el) { el.focus(); el.select(); }
  }
}

// 1차 매도로 이미 차감된 수량을 포함한 '원래 보유수량'
function origQty(e) {
  return (e.qty || 0) + (e.sold1 ? (e.sell1Applied || 0) : 0);
}
// 아직 보유수량에서 차감되지 않은 1차 매도 수량(예상 또는 기존 데이터)
function pendingSell(e) {
  return (e.sell1Qty > 0 ? e.sell1Qty : 0) - (e.sold1 ? (e.sell1Applied || 0) : 0);
}

function toggleSold(id, which, val) {
  var e = null;
  for (var i = 0; i < entries.length; i++) { if (entries[i].id === id) { e = entries[i]; break; } }
  if (e) {
    if (which === 1 && val) { renderAll(); openSell1Modal(id); return; }
    if (which === 1) {
      // 체크 해제 시: 차감했던 수량을 보유수량에 되돌리고 1차 매도 정보를 초기화
      if (!val && e.sold1) {
        if (e.sell1Applied) e.qty = (e.qty || 0) + e.sell1Applied;
        e.sell1Applied = 0;
        e.sell1Qty = null;
        e.sell1Price = null;
      }
      e.sold1 = val;
    }
    save(); renderAll();
  }
}

function updateCur(id, val) {
  var e = null;
  for (var i = 0; i < entries.length; i++) { if (entries[i].id === id) { e = entries[i]; break; } }
  if (e) { e.cur = parseFloat(val) || null; save(); renderAll(); }
}

function updateEntry(id, val) {
  var e = findEntry(id), v = parseFloat(val);
  if (e && v > 0) { e.entry = v; save(); renderAll(); }
}

function updateQty(id, val) {
  var e = findEntry(id);
  if (e) { e.qty = parseFloat(val) || null; save(); renderAll(); }
}

function updateLow(id, which, val) {
  var e = findEntry(id);
  if (e) { e[which] = parseFloat(val) || null; save(); renderAll(); }
}

function clearAll() {
  if (entries.length === 0) return;
  if (!confirm('전체 손절가를 삭제할까요?')) return;
  entries = [];
  save();
  renderAll();
  showToast('전체 삭제 완료', 'warn');
}

function renderOverview() {
  var body = document.getElementById('overviewBody');
  var countEl = document.getElementById('overviewCount');
  var totEl = document.getElementById('overviewTotalEval');
  var active = entries.filter(function(e){ return e.executed !== true; });
  countEl.textContent = active.length + '개';

  if (active.length === 0) {
    body.innerHTML = '<div class="empty-msg" style="padding:16px 0">표시할 종목 없음</div>';
    totEl.textContent = '−'; totEl.style.color = '#fff';
    return;
  }

  var tot = 0, any = false;
  active.forEach(function(e) {
    if (e.cur !== null && !isNaN(e.cur) && e.qty && e.entry) { tot += Math.round((e.cur - e.entry) * e.qty); any = true; }
  });
  if (any) { totEl.textContent = fmtWon(tot); totEl.style.color = tot >= 0 ? 'var(--accent)' : '#ff5252'; }
  else { totEl.textContent = '−'; totEl.style.color = '#fff'; }

  var sorted = active.slice().sort(function(a, b) {
    var pa = (a.entry && a.cur) ? (a.cur - a.entry) / a.entry : -999;
    var pb = (b.entry && b.cur) ? (b.cur - b.entry) / b.entry : -999;
    return pb - pa;
  });

  body.innerHTML = sorted.map(function(e) {
    var st = getStatus(e);
    var dotColor = st.cls === 'status-breach' ? '#ff5252' : st.cls === 'status-near' ? 'var(--warn)' : st.cls === 'status-profit' ? 'var(--accent)' : '#fff';
    var hasCurV = e.cur !== null && !isNaN(e.cur);
    var entryPct = (e.entry && e.cur) ? ((e.cur - e.entry) / e.entry * 100) : null;
    var pctColor = entryPct === null ? '#fff' : entryPct >= 0 ? 'var(--accent)' : '#ff5252';
    var pctStr = entryPct === null ? '−' : fmtPct(entryPct);
    var pnlAmt = (hasCurV && e.qty && e.entry) ? Math.round((e.cur - e.entry) * e.qty) : null;
    var pnlStr = pnlAmt !== null ? fmtWon(pnlAmt) : '−';
    var pnlAmtColor = pnlAmt === null ? '#fff' : pnlAmt >= 0 ? 'var(--accent)' : '#ff5252';

    // 매수경과일 (주말·공휴일 제외 영업일 기준)
    var holdDays = null;
    if (e.buyDate) {
      var bd = new Date(e.buyDate + 'T00:00:00');
      if (!isNaN(bd.getTime())) { var t0 = new Date(); t0.setHours(0,0,0,0); holdDays = businessDaysBetween(bd, t0); }
    }
    var overdue = holdDays !== null && holdDays >= 11;

    // 6일·11일 저가: 매수가 대비 % · 그 가격에 팔 때 손익금액
    var lowRows = [['6일', e.low6], ['11일', e.low11]].map(function(x) {
      var i = lowInfo(hasCurV ? e.cur : e.entry, e.entry, x[1], e.qty);
      if (!i) return '';
      var br = hasCurV && e.cur <= x[1];
      var nr = !br && hasCurV && e.cur <= x[1] * 1.03;
      var lc = br ? '#ff5252' : nr ? 'var(--warn)' : '#fff';
      return '<div class="overview-row-low" style="font-size:11px">'
        + '<span class="' + (br ? 'low-alert-blink' : '') + '" style="color:' + lc + (br || nr ? ';font-weight:700' : '') + '">' + (br || nr ? '⚠ ' : '') + x[0] + ' 저가 ' + Math.round(x[1]).toLocaleString() + '원</span>'
        + '<span style="color:#fff">매수대비 <span style="color:' + lowCol(i) + '">' + fmtPct(i.pct) + '</span>'
        + (i.amt !== null ? ' · <span style="font-size:12px;font-weight:700;color:' + amtCol(i) + '">' + fmtWon(i.amt) + '</span>' : '') + '</span>'
        + '</div>';
    }).join('');

    // 1차 매도 기록
    var s1 = '';
    if (e.sold1 && e.sell1Qty > 0) {
      var sp = e.sell1Price > 0 ? e.sell1Price : null;
      var sPnl = (sp && e.entry) ? Math.round((sp - e.entry) * e.sell1Qty) : null;
      var neg = sPnl !== null && sPnl < 0;
      var sc = neg ? '#ff5252' : 'var(--accent)';
      s1 = '<div class="overview-row-low" style="font-size:11px"><span style="color:' + sc + ';background:' + (neg ? 'rgba(255,82,82,.15)' : 'rgba(0,229,160,.15)') + ';border:1px solid ' + (neg ? 'rgba(255,82,82,.5)' : 'rgba(0,229,160,.45)') + ';border-radius:3px;padding:0 5px">✓ 1차 매도 '
        + e.sell1Qty.toLocaleString() + '주' + (sp ? ' @' + sp.toLocaleString() + '원 (' + fmtPct((sp - e.entry) / e.entry * 100) + ')' : '') + '</span></div>'
        + (sPnl !== null ? '<div class="overview-row-low" style="font-size:11px;color:#fff">실현수익 <span style="font-size:12px;font-weight:700;color:' + sc + '">' + fmtWon(sPnl) + '</span>'
          + ((e.qty !== null && e.qty !== undefined) ? ' · 남은 ' + (e.qty - pendingSell(e)).toLocaleString() + '주' : '') + '</div>' : '');
    }

    return '<div class="overview-row" onclick="scrollToCard(\'' + e.id + '\')" style="cursor:pointer">'
      + '<div class="overview-row-top">'
        + '<span class="overview-dot" style="background:' + dotColor + '"></span>'
        + '<span class="overview-name" style="flex:0 1 auto;min-width:0">' + (e.name || '종목명없음') + '</span>'
        + '<span style="font-size:10px;color:#fff;white-space:nowrap;flex-shrink:0">'
          + (e.qty ? e.qty.toLocaleString() + '주' : '')
          + ((e.qty && e.entry) ? ' · ' + Math.round(e.entry * e.qty / 10000).toLocaleString() + '만' : '')
          + (holdDays !== null ? (e.qty ? ' · ' : '') + '<span class="' + (overdue ? 'hold-overdue-box' : '') + '" style="' + (overdue ? 'color:#ff5252;font-weight:600' : '') + '">' + holdDays + '일</span>' : '')
        + '</span>'
        + '<span class="overview-pct" style="color:' + pctColor + ';font-size:16px;margin-left:auto">' + pctStr + '</span>'
      + '</div>'
      + '<div class="overview-row-mid">'
        + (e.entry ? '<span style="font-size:11px;color:#fff">' + Math.round(e.entry).toLocaleString() + (hasCurV ? ' → ' + Math.round(e.cur).toLocaleString() : '') + '원</span>' : '')
        + '<span class="overview-amt" style="color:' + pnlAmtColor + ';margin-left:auto">' + pnlStr + '</span>'
      + '</div>'
      + lowRows + s1
      + '</div>';
  }).join('');
}

function scrollToCard(id) {
  var card = document.getElementById('card-' + id);
  if (!card) return;
  card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  card.style.transition = 'box-shadow .2s';
  card.style.boxShadow = '0 0 0 2px var(--accent)';
  setTimeout(function(){ card.style.boxShadow = ''; }, 1200);
}

// ── 렌더링 ──
function getStatus(e) {
  if (e.cur === null || isNaN(e.cur)) return { cls: '', badge: '대기중', badgeCls: 'badge-ok' };
  if (e.low11 > 0 && e.cur <= e.low11) return { cls: 'status-breach', badge: '⚠ 11일 저가 이탈', badgeCls: 'badge-breach' };
  if (e.low6 > 0 && e.cur <= e.low6)   return { cls: 'status-breach', badge: '⚠ 6일 저가 이탈', badgeCls: 'badge-breach' };
  var ref = Math.max(e.low6 || 0, e.low11 || 0);
  if (ref > 0 && e.cur <= ref * 1.03) return { cls: 'status-near', badge: '▲ 저가 근접', badgeCls: 'badge-near' };
  if (e.entry && e.cur > e.entry) return { cls: 'status-profit', badge: '정상', badgeCls: 'badge-ok' };
  return { cls: '', badge: '정상', badgeCls: 'badge-ok' };
}

function renderAll() {
  renderSummary();
  renderList();
  renderOverview();
}

function renderSummary() {
  var n = entries.length;
  var lossCount = 0, profitCount = 0, waitCount = 0;
  var totalPnl = 0, totalPnlCost = 0, pnlCount = 0, actualSumAmt = 0, actualSumCount = 0;
  entries.forEach(function(e) {
    if (e.executed === true) return; // 손절완료 제외
    if (e.cur !== null && !isNaN(e.cur) && e.entry) {
      if (e.cur < e.entry) lossCount++;
      else if (e.cur > e.entry) profitCount++;
      else waitCount++;
    } else { waitCount++; }
    if (e.cur && e.entry && e.qty && !isNaN(e.cur)) {
      totalPnl += Math.round((e.cur - e.entry) * e.qty);
      totalPnlCost += e.entry * e.qty;
      pnlCount++;
    }
    if (e.entry && e.qty) { actualSumAmt += e.entry * e.qty; actualSumCount++; }
  });

  var pnlEl = document.getElementById('sum_pnl');
  var pnlSubEl = document.getElementById('sum_pnl_sub');
  if (pnlCount > 0) {
    var pnlRate = totalPnlCost > 0 ? (totalPnl / totalPnlCost * 100) : 0;
    var pnlColor = totalPnl > 0 ? 'var(--accent)' : totalPnl < 0 ? 'var(--danger)' : 'var(--text3)';
    pnlEl.textContent = (totalPnl >= 0 ? '+' : '−') + Math.round(Math.abs(totalPnl) / 10000).toLocaleString() + '만';
    pnlEl.style.color = pnlColor;
    pnlSubEl.innerHTML = '<span style="color:' + pnlColor + ';font-weight:700">' + (pnlRate >= 0 ? '+' : '−') + Math.abs(pnlRate).toFixed(1) + '%</span> · ' + pnlCount + '종목';
  } else {
    pnlEl.textContent = '−';
    pnlEl.style.color = 'var(--text3)';
    pnlSubEl.textContent = '현재가 입력 시';
  }

  document.getElementById('sum_count').textContent = n + '개';
  document.getElementById('listCount').textContent = n + '개';
  [['sum_loss_badge', '↓' + lossCount, lossCount], ['sum_profit_badge', '↑' + profitCount, profitCount], ['sum_wait_badge', '—' + waitCount, waitCount]].forEach(function(b) {
    var el = document.getElementById(b[0]);
    el.textContent = b[1];
    el.style.display = b[2] > 0 ? 'inline-block' : 'none';
  });

  document.getElementById('cfg_actual_sum').textContent = actualSumCount > 0 ? Math.round(actualSumAmt / 10000).toLocaleString() : '−';
}

function renderList() {
  var el = document.getElementById('stopList');
  if (entries.length === 0) {
    el.innerHTML = '<div class="empty-msg">등록된 손절가 없음<br>매수 즉시 손절가를 등록하세요</div>';
    return;
  }

  var sorted = entries.slice().sort(function(a, b) {
    var score = function(e) {
      if (e.executed === true) return 3;
      var s = getStatus(e);
      return s.cls === 'status-breach' ? 2 : s.cls === 'status-near' ? 1 : 0;
    };
    var sd = score(a) - score(b);
    if (sd !== 0) return sd;
    var pctA = (a.cur !== null && a.entry) ? (a.cur - a.entry) / a.entry : -Infinity;
    var pctB = (b.cur !== null && b.entry) ? (b.cur - b.entry) / b.entry : -Infinity;
    return pctB - pctA;
  });

  var F  = "font-family:'IBM Plex Mono',monospace;";
  var ms = 'background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:5px;padding:6px 8px;display:flex;flex-direction:column;gap:2px';
  var lbl = F + 'font-size:8px;color:var(--text2);letter-spacing:1px';

  el.innerHTML = sorted.map(function(e) {
    var st = getStatus(e);
    var isExec = e.executed === true, isMissed = e.executed === false;
    var entryPct = (e.entry && e.cur) ? ((e.cur - e.entry) / e.entry * 100).toFixed(2) : null;
    var curColor = st.cls === 'status-breach' ? '#ff5252' : st.cls === 'status-near' ? 'var(--warn)' : 'var(--accent)';

    var holdDays = '';
    if (e.buyDate) {
      var bd2 = new Date(e.buyDate + 'T00:00:00');
      if (!isNaN(bd2.getTime())) { var t0 = new Date(); t0.setHours(0,0,0,0); holdDays = '매수후 ' + businessDaysBetween(bd2, t0) + '영업일째'; }
    }

    // 핵심 지표: 매수가 / 6일 저가 / 11일 저가
    var blocks = '';
    if (e.entry) {
      blocks += '<div style="' + ms + '"><div style="' + lbl + '">매수가</div><div style="' + F + 'font-size:12px;font-weight:600">' + e.entry.toLocaleString() + '원</div>'
        + (e.qty ? '<div style="' + F + 'font-size:9px;color:var(--text3)">' + e.qty.toLocaleString() + '주 보유</div>' : '') + '</div>';
    }
    [['6일', e.low6], ['11일', e.low11]].forEach(function(x) {
      var i = lowInfo(e.cur > 0 ? e.cur : e.entry, e.entry, x[1], e.qty);
      blocks += '<div style="' + ms + '"><div style="' + lbl + '">' + x[0] + ' 저가</div>'
        + '<div style="' + F + 'font-size:12px;font-weight:600">' + (x[1] > 0 ? Math.round(x[1]).toLocaleString() + '원' : '−') + '</div>'
        + (i ? '<div style="' + F + 'font-size:9px;color:' + lowCol(i) + '">' + fmtPct(i.pct) + '</div>'
             + (i.amt !== null ? '<div style="' + F + 'font-size:9px;color:' + amtCol(i) + '">' + fmtWon(i.amt) + '</div>' : '') : '')
        + '</div>';
    });

    // 입력 줄
    var nav = function(next, prev) {
      return ' onkeydown="cardInputNav(event,' + (next ? "'" + next + '-' + e.id + "'" : 'null') + ',' + (prev ? "'" + prev + '-' + e.id + "'" : 'null') + ')"';
    };
    var inp = function(kind, ph, val, cls, fn, next, prev) {
      return '<input class="price-input' + (cls ? ' ' + cls : '') + '" type="number" placeholder="' + ph + '" ' + (val ? 'value="' + val + '"' : '')
        + ' id="' + kind + '-' + e.id + '" onchange="' + fn + '"' + nav(next, prev) + '>';
    };
    var inputs = '<div class="price-input-row">'
      + '<div class="price-input-line">' + inp('entry', '매수가...', e.entry, '', 'updateEntry(' + e.id + ',this.value)', 'qty', null)
        + inp('qty', '보유수량(주)...', e.qty, '', 'updateQty(' + e.id + ',this.value)', 'cur', 'entry') + '</div>'
      + '<div class="price-input-line">' + inp('cur', '현재가...', e.cur, '', 'updateCur(' + e.id + ',this.value)', 'low6', 'qty')
        + '<div class="price-status" style="color:' + curColor + '">'
        + (entryPct !== null ? '<span style="font-size:12px;font-weight:600">' + (parseFloat(entryPct) >= 0 ? '+' : '') + entryPct + '%</span>' : '<span style="color:var(--text2);font-size:11px">현재가 입력</span>')
        + '</div></div>'
      + '<div class="price-input-line">' + inp('low6', '6일 저가...', e.low6, 'low-input', "updateLow(" + e.id + ",'low6',this.value)", 'low11', 'cur')
        + inp('low11', '11일 저가...', e.low11, 'low-input', "updateLow(" + e.id + ",'low11',this.value)", null, 'low6') + '</div>'
      + '</div>';

    return '<div id="card-' + e.id + '" class="stop-card ' + st.cls + '" style="' + (isExec ? 'opacity:0.55;' : '') + '">'
      + '<div class="card-top">'
      +   '<div style="display:flex;flex-direction:column;gap:3px">'
      +     '<span class="card-name">' + e.name + '</span>'
      +     (e.buyDate ? '<span style="' + F + 'font-size:9px;color:var(--text3)">' + e.buyDate + (holdDays ? ' · ' + holdDays : '') + '</span>' : '')
      +   '</div>'
      +   '<div class="card-actions">'
      +     (isExec ? '<span class="status-badge" style="background:rgba(0,229,160,.1);color:var(--accent);border:1px solid rgba(0,229,160,.2)">✓ 손절완료</span>'
         : isMissed ? '<span class="status-badge" style="background:rgba(255,183,77,.15);color:var(--warn);border:1px solid rgba(255,183,77,.3)">⚠ 미실행</span>'
         :            '<span class="status-badge ' + st.badgeCls + '">' + st.badge + '</span>')
      +     '<span class="del-btn" style="color:var(--accent2);font-size:11px" onclick="editStop(' + e.id + ')">✎</span>'
      +     '<span class="del-btn" onclick="removeStop(' + e.id + ')">✕</span>'
      +   '</div>'
      + '</div>'
      + (e.memo ? '<div style="' + F + 'font-size:10px;color:var(--accent2);background:rgba(77,166,255,.06);border:1px solid rgba(77,166,255,.15);border-radius:4px;padding:5px 8px">📌 ' + e.memo + '</div>' : '')
      + '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">' + blocks + '</div>'
      + (!isExec ? '<div style="display:flex;gap:10px;padding:4px 0 4px;border-top:1px solid var(--border)">'
        + '<label style="display:flex;align-items:center;gap:5px;cursor:pointer;' + F + 'font-size:11px;color:' + (e.sold1 ? 'var(--accent)' : 'var(--text3)') + '">'
        +   '<input type="checkbox" ' + (e.sold1 ? 'checked' : '') + ' onchange="toggleSold(' + e.id + ',1,this.checked)" style="width:14px;height:14px;cursor:pointer;accent-color:var(--accent)">'
        +   (e.sold1 ? '✓ 1차 매도' : '1차 매도')
        + '</label></div>' : '')
      + (!isExec ? inputs : '')
      + '<div style="' + F + 'font-size:10px;color:var(--text2)">' + e.addedAt + ' 등록</div>'
      + '</div>';
  }).join('');
}

// ── 손절 실행 기록 ──
function markExec(id, val) {
  for (var i = 0; i < entries.length; i++) {
    if (entries[i].id === id) {
      entries[i].executed = val;
      break;
    }
  }
  save(); renderAll();
  if (val === true)  showToast('✓ 손절 실행 기록됨', 'ok');
  if (val === false) showToast('⚠ 손절 미실행 기록됨', 'warn');
}

// ── 저장/복원 ──
function save() {
  _set('sl_entries', JSON.stringify(entries));
}

function load() {
  try {
    var savedInputOpen = _get('sl_input_open');
    if (savedInputOpen === '1') { inputPanelOpen = true; }
    applyInputPanel();
  } catch(e) {}
  try {
    var savedOverviewOpen = _get('sl_overview_open');
    if (savedOverviewOpen === '1') { overviewPanelOpen = true; }
    applyOverviewPanel();
  } catch(e) {}
  try {
    var d = _get('sl_entries');
    if (d) entries = JSON.parse(d);
  } catch(e) {}
  renderAll();
}

// ── 토스트 ──
function showToast(msg, type) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.style.borderColor = type === 'warn' ? 'var(--warn)' : type === 'ok' ? 'var(--accent)' : 'var(--danger)';
  el.classList.add('show');
  setTimeout(function() { el.classList.remove('show'); }, 2500);
}

// ── 1차 매도 실제 정보 입력 ──
function openSell1Modal(id) {
  var e = null;
  for (var i = 0; i < entries.length; i++) { if (entries[i].id === id) { e = entries[i]; break; } }
  if (!e) return;
  var tgtP = null;
  var curP = (e.cur !== null && !isNaN(e.cur) && e.cur > 0) ? e.cur : null;

  var overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
  var box = document.createElement('div');
  box.style.cssText = 'background:#111418;border:1px solid #2a3340;border-radius:10px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px';

  var title = document.createElement('div');
  title.style.cssText = 'font-family:IBM Plex Mono,monospace;font-size:11px;color:#00e5a0;letter-spacing:1px';

  var legacyUnapplied = !!(e.sold1 && e.sell1Qty > 0 && e.sell1Applied === undefined);

// ── 파일로 가져오기 ──
function importFile(input) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var parsed = JSON.parse(e.target.result);
      if (!parsed || !Array.isArray(parsed.entries)) throw new Error('invalid');
      entries = parsed.entries;
      save();
      renderAll();
      showToast('✓ 파일 가져오기 완료 · ' + entries.length + '개 종목', 'ok');
    } catch(e) {
      showToast('⚠ 올바른 파일이 아닙니다', 'danger');
    }
    input.value = '';
  };
  reader.readAsText(file, 'UTF-8');
}

  inputPanelOpen = !inputPanelOpen;

  _set('sl_input_open', inputPanelOpen ? '1' : '0');
}

function applyInputPanel() {
  var body     = document.getElementById('inputPanelBody');
  var chevron  = document.getElementById('inputPanelChevron');
  var header   = document.getElementById('inputPanelHeader');
  if (!body) return;
  if (inputPanelOpen) {
    body.style.display = 'flex';
    if (chevron) chevron.style.transform = 'rotate(180deg)';
    if (header)  header.style.borderBottom = '1px solid var(--border)';
  } else {
    body.style.display = 'none';
    if (chevron) chevron.style.transform = 'rotate(0deg)';
    if (header)  header.style.borderBottom = 'none';
  }
}

  _set('sl_overview_open', overviewPanelOpen ? '1' : '0');
}

function applyOverviewPanel() {
  var body     = document.getElementById('overviewBody');
  var chevron  = document.getElementById('overviewPanelChevron');
  var header   = document.getElementById('overviewPanelHeader');
  if (!body) return;
  if (overviewPanelOpen) {
    body.style.display = 'block';
    if (chevron) chevron.style.transform = 'rotate(180deg)';
    if (header)  header.style.borderBottom = '1px solid var(--border)';
  } else {
    body.style.display = 'none';
    if (chevron) chevron.style.transform = 'rotate(0deg)';
    if (header)  header.style.borderBottom = 'none';
  }
}

// ── Enter 키 바인딩 ──
['sl_name','sl_entry','sl_low6','sl_low11','sl_qty','sl_memo'].forEach(function(id) {
  var el = document.getElementById(id);
  if (el) el.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); addStop(); } });
});

// ── 초기화 ──
load();
</script>
</body>
</html>
